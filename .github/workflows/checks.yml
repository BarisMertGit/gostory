name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.48.0-0.5.pre'
          channel: beta
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter test --dart-define=SIMULATOR_PREVIEW=true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firebase/functions
      - run: npm run check --prefix firebase/functions
      - run: npm test --prefix firebase/functions
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firebase/tests
      - run: npx --yes firebase-tools@14 emulators:exec --project demo-gostory --only firestore,storage "npm test --prefix firebase/tests"
  native-flow:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.48.0-0.5.pre'
          channel: beta
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Start an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/gostory-simulators.json"
          GOSTORY_SIMULATOR_ID=$(python3 -c 'import json, os; data=json.load(open(os.environ["RUNNER_TEMP"] + "/gostory-simulators.json")); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          echo "GOSTORY_SIMULATOR_ID=$GOSTORY_SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$GOSTORY_SIMULATOR_ID" -b
      - run: flutter test integration_test/memory_flow_test.dart -d "$GOSTORY_SIMULATOR_ID" --no-pub
