name: gostory
description: Personal digital memory archive with usernames. Drop photos and notes at physical locations.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Camera
  camera: ^0.11.0+2

  # Location
  geolocator: ^13.0.2

  # Maps
  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geocoding: ^4.0.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  firebase_app_check: ^0.4.8
  connectivity_plus: ^7.3.1
  cached_network_image: ^3.4.1
  flutter_svg: '>=2.0.17 <2.1.0'
  lottie: 3.3.1
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

# Keep the new SVG renderer compatible with the declared Dart 3.6 baseline.
# Newer releases of these transitive dependencies require Dart 3.10+.
dependency_overrides:
  vector_graphics: 1.1.18
  vector_graphics_compiler: 1.1.16

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon.svg
    - assets/animations/
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/Inter-OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
